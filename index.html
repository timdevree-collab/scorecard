<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Scorebord</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000000;
      color: #ffffff;
    }

    .table-container {
      overflow: auto;
      max-height: 100vh;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 600px;
    }

    th, td {
      border: 1px solid #444;
      padding: 6px 8px;
      text-align: left;
      white-space: nowrap;
    }

    thead tr {
      background: #c00000;
      color: #ffffff;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    tbody tr:nth-child(even) {
      background: #111111;
    }

    tbody tr:nth-child(odd) {
      background: #000000;
    }

    /* Linkerkolom sticky */
    td:first-child, th:first-child {
      position: sticky;
      left: 0;
      background: #c00000;
      color: #ffffff;
      z-index: 6;
    }

    /* SCORE‑kolom rood (2e kolom) */
    td:nth-child(2),
    th:nth-child(2) {
      background: #c00000;
      color: #ffffff;
    }

  </style>
</head>
<body>

  <div class="table-container">
    <table id="scoreTable">
      <thead id="tableHead">
