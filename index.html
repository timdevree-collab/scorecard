<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Quiz 100 jaar Gansrijden Zandvliet </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000000;
      color: #ffffff;
    }

    /* Sticky titel bovenaan */
    .title {
      position: sticky;
      top: 0;
      z-index: 50;
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      padding: 15px 0;
      background: #000000;
      color: #ffffff;
      border-bottom: 2px solid #c00000;
    }

    .table-container {
      overflow: auto;
      max-height: 100vh;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 600px;
    }

    th, td {
      border: 1px solid #444;
      padding: 6px 8px;
      white-space: nowrap;
      text-align: center;
    }

    thead tr {
      background: #c00000;
      color: #ffffff;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    tbody tr:nth-child(even) { background: #111; }
    tbody tr:nth-child(odd)  { background: #000; }

    /* ============================
       KOLOM 1 — sticky + vet
       ============================ */
    td:first-child,
    th:first-child {
      position: sticky;
      left: 0;
      background: #c00000;
      color: #ffffff;
      z-index: 10;

      width: 35px;
      min-width: 35px;
      max-width: 35px;

      padding: 0 3px;
      box-sizing: border-box;
      text-align: center;
      font-size: 11px;

      font-weight: bold;   /* <-- VET */
    }

    /* ============================
       KOLOM 2 — sticky + vet
       ============================ */
    td:nth-child(2),
    th:nth-child(2) {
      position: sticky;
      left: 35px;
      background: #c00000;
      color: #ffffff;
      z-index: 9;

      font-size: 12px;
      width: 240px;
      min-width: 240px;
      max-width: 240px;

      padding: 0 6px;
      box-sizing: border-box;
      text-align: left;
      white-space: normal;

      font-weight: bold;   /* <-- VET */
    }

 /* ============================
   KOLOM 16 — sticky + vet + rood + centraal
   ============================ */
td:nth-child(16),
th:nth-child(16) {
  position: sticky;
  left: 275px;              /* 35px (kolom 1) + 240px (kolom 2) */
  background: #c00000;      /* rood */
  color: #ffffff;
  z-index: 8;

  font-size: 12px;
  width: 240px;
  min-width: 240px;
  max-width: 240px;

  padding: 0 6px;
  box-sizing: border-box;
  text-align: center;       /* <-- CENTRAAL */
  white-space: normal;

  font-weight: bold;
}




    
  </style>
</head>
<body>

  <!-- Sticky Titel -->
  <div class="title">Quiz 100 jaar Gansrijden Zandvliet </div>

  <div class="table-container">
    <table id="scoreTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSK6OgbEvumfLvHWzht249FtRowmmoYtstc2mlFfzoh54j-NL3kHLBn8Jbz4AV2-A/pub?gid=1965759856&single=true&output=csv";

    const TEAM_COL = 0;
    const SCORE_COL = 1;

    async function loadData() {
      try {
        const res = await fetch(CSV_URL);
        const text = await res.text();

        const rows = text.trim().split("\n").map(r => r.split(","));
        if (rows.length < 2) return;

        const headers = rows[0];
        const data = rows.slice(1);

        buildTable(headers, data);
      } catch (e) {
        console.error("Fout bij laden CSV:", e);
      }
    }

    function buildTable(headers, data) {
      const headEl = document.getElementById("tableHead");
      const bodyEl = document.getElementById("tableBody");

      headEl.innerHTML = "";
      bodyEl.innerHTML = "";

      const trHead = document.createElement("tr");
      headers.forEach(h => {
        const th = document.createElement("th");
        th.textContent = h;
        trHead.appendChild(th);
      });
      headEl.appendChild(trHead);

      data.forEach(row => {
        const tr = document.createElement("tr");
        row.forEach(cell => {
          const td = document.createElement("td");
          td.textContent = cell;
          tr.appendChild(td);
        });
        bodyEl.appendChild(tr);
      });
    }

    loadData();
  </script>

</body>
</html>
